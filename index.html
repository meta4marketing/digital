<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Gallery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f8f9fa; }
    .card { transition: transform 0.3s; }
    .card:hover { transform: scale(1.05); }
    .whatsapp-btn { background:#25D366; color:#fff; }
    .stars { color: gold; }
  </style>
</head>
<body>
  <div class="container py-4">
    <h2 class="text-center mb-4">Our Products</h2>
    <div class="row" id="product-list"></div>
  </div>

  <script>
    const products = [
      {name:"Luxury Sofa",desc:"Premium sofa for modern living.",img:"https://picsum.photos/300/200?sofa"},
      {name:"King Size Bed",desc:"Spacious bed with wood finish.",img:"https://picsum.photos/300/200?bed"},
      {name:"Dining Table",desc:"Elegant dining table set.",img:"https://picsum.photos/300/200?table"},
      {name:"Office Chair",desc:"Comfortable ergonomic chair.",img:"https://picsum.photos/300/200?chair"},
      {name:"Bookshelf",desc:"Stylish wooden bookshelf.",img:"https://picsum.photos/300/200?books"},
      {name:"Wardrobe",desc:"Large wardrobe with mirror.",img:"https://picsum.photos/300/200?wardrobe"},
      {name:"Coffee Table",desc:"Modern glass coffee table.",img:"https://picsum.photos/300/200?coffee"},
      {name:"TV Unit",desc:"Compact TV stand design.",img:"https://picsum.photos/300/200?tv"},
      {name:"Study Desk",desc:"Minimalist study desk.",img:"https://picsum.photos/300/200?desk"},
      {name:"Recliner",desc:"Relaxing recliner chair.",img:"https://picsum.photos/300/200?recliner"}
    ];

    const container = document.getElementById('product-list');
    products.forEach(p=>{
      const col = document.createElement('div');
      col.className="col-md-4 col-sm-6 mb-4";
      col.innerHTML=`
        <div class="card h-100">
          <img src="${p.img}" class="card-img-top" alt="${p.name}">
          <div class="card-body">
            <h5 class="card-title">${p.name}</h5>
            <p class="stars">★★★★★</p>
            <p class="card-text">${p.desc}</p>
            <a href="https://wa.me/919382085005?text=${encodeURIComponent('Product: '+p.name)}" 
               target="_blank" class="btn whatsapp-btn w-100">WhatsApp</a>
          </div>
        </div>`;
      container.appendChild(col);
    });
  </script>
</body>
</html>
