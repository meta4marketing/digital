<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Gallery</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body{
      background:#f8f9fa;
    }

    .card{
      transition:.3s;
      border:none;
      box-shadow:0 4px 10px rgba(0,0,0,.1);
    }

    .card:hover{
      transform:scale(1.05);
    }

    .card img{
      height:220px;
      object-fit:cover;
    }

    .stars{
      color:gold;
      font-size:18px;
      margin-bottom:8px;
    }

    .price{
      color:#dc3545;
      font-size:22px;
      font-weight:bold;
      margin-bottom:10px;
    }

    .whatsapp-btn{
      background:#25D366;
      color:#fff;
      font-weight:bold;
    }

    .whatsapp-btn:hover{
      background:#1ebc5a;
      color:#fff;
    }
  </style>
</head>

<body>

<div class="container py-4">

    <h2 class="text-center mb-4">Our Products</h2>

    <div class="row" id="product-list"></div>

</div>

<script>

const products = [

{
name:"Digital Marketing Career Growth",
price:"₹4999 /- only",
desc:"Transform your career with digital marketing. duration 21 days.",
img:"1(1).png"
},

{
name:"Learn SEO SMM GOOGLE Ads",
price:"₹4999",
desc:"Skill oeiented live clasess like seo smm and google ads. duration 21 days.",
img:"1(2).png"
},

{
name:"Live Client Hunting Master Class.",
price:"₹5,999",
desc:"full client hunting course from beginner to professional. duration 30 days.",
img:"`1(3).png"
},

{
name:"Dgital Marketing Full Course",
price:"₹7,499",
desc:"live master class in full digital marketing course, duration 45 days. ",
img:"1(4).png"
},

{
name:"Client Hunting Full Live Class",
price:"₹11,999",
desc:"40 days find targeted customer database from online paid and free resources and learn client huting paid method live master class.",
img:"1(5).png"
},

{
name:"Wardrobe",
price:"₹27,999",
desc:"Large wardrobe with mirror.",
img:"https://picsum.photos/300/200?wardrobe"
},

{
name:"Coffee Table",
price:"₹8,999",
desc:"Modern glass coffee table.",
img:"https://picsum.photos/300/200?coffee"
},

{
name:"TV Unit",
price:"₹14,999",
desc:"Compact TV stand design.",
img:"https://picsum.photos/300/200?tv"
},

{
name:"Study Desk",
price:"₹9,999",

},

{

desc:"Relaxing recliner chair.",

}

];

const container = document.getElementById("product-list");

products.forEach(product=>{

const whatsappMessage =
`Hello,

I am interested in this product.

Product Name: ${product.name}
Price: ${product.price}

Please share more details.`;

const whatsappURL =
`https://wa.me/919382085005?text=${encodeURIComponent(whatsappMessage)}`;

container.innerHTML += `

<div class="col-lg-4 col-md-6 mb-4">

<div class="card h-100">

<img src="${product.img}" class="card-img-top" alt="${product.name}">

<div class="card-body d-flex flex-column">

<h5 class="card-title">${product.name}</h5>

<div class="stars">★★★★★</div>

<div class="price">${product.price}</div>

<p class="card-text flex-grow-1">
${product.desc}
</p>

<a href="${whatsappURL}"
target="_blank"
class="btn whatsapp-btn w-100">

WhatsApp Enquiry

</a>

</div>

</div>

</div>

`;

});

</script>

</body>
</html>
