<!DOCTYPE html>
<html lang="en">
<head>

  <title>Product Gallery</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body{
      background:#f8f9fa;
    }

    .card{
      transition:.3s;
      border:none;
      box-shadow:0 4px 10px rgba(0,0,0,.1);
    }

    .card:hover{
      transform:scale(1.05);
    }

    .card img{
      height:220px;
      object-fit:cover;
    }

    .stars{
      color:gold;
      font-size:18px;
      margin-bottom:8px;
    }

    .price{
      color:#dc3545;
      font-size:22px;
      font-weight:bold;
      margin-bottom:10px;
    }

    .whatsapp-btn{
      background:#25D366;
      color:#fff;
      font-weight:bold;
    }

    .whatsapp-btn:hover{
      background:#1ebc5a;
      color:#fff;
    }
   .live-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background-color: red;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: bold;
      font-size: 14px;
      animation: blink 1s infinite;
      box-shadow: 0 0 10px rgba(255,0,0,0.7);

      /* Floating fixed position */
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 9999;
    }

    @keyframes blink {
      0%   { opacity: 1; }
      50%  { opacity: 0.3; }
      100% { opacity: 1; }
    }
  </style>
</head>
